# Memory Review — Rubion baseline
#
# Aylik otomatik denetim. docs/memory/ vault'undaki bayatlamis dosyalari,
# broken link'leri ve "kod degisti ama doc eski" durumlarini issue olarak acar.
#
# Kullanim:
#   1. Bu dosyayi .github/workflows/memory-review.yml olarak kopyala
#   2. (Opsiyonel) cron'u projenin ritmine gore ayarla
#
# Gerekli yetki: GITHUB_TOKEN (varsayilan), issue create izni

name: Memory Review

on:
  schedule:
    - cron: '0 9 1 * *'    # Her ayin 1'i, 09:00 UTC

  workflow_dispatch:        # Manuel tetikleme

jobs:
  review:
    name: Memory vault denetimi
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # git log cross-check icin tum history

      - name: docs/memory var mi?
        id: check
        run: |
          if [ -d "docs/memory" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::notice::docs/memory bulunamadi — setup-memory skill'i ile kurun"
          fi

      - name: Setup Node
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install lychee (link checker)
        if: steps.check.outputs.exists == 'true'
        run: |
          curl -sSfL https://github.com/lycheeverse/lychee/releases/latest/download/lychee-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv lychee /usr/local/bin/

      - name: Bayatlik denetimi
        if: steps.check.outputs.exists == 'true'
        id: staleness
        run: |
          set +e
          today=$(date +%Y-%m-%d)
          today_sec=$(date +%s)

          declare -i stale=0
          declare -i very_stale=0
          declare -i no_metadata=0

          {
            echo "## Bayatlik Raporu"
            echo ""
            echo "| Dosya | last_reviewed | Yas | Etiket |"
            echo "|---|---|---|---|"
          } > report.md

          while IFS= read -r f; do
            review=$(grep -m1 "^last_reviewed:" "$f" | sed 's/last_reviewed: *//' | tr -d '"' | xargs)
            if [ -z "$review" ]; then
              no_metadata=$((no_metadata + 1))
              echo "| $f | (yok) | — | 🔴 metadata eksik |" >> report.md
              continue
            fi

            review_sec=$(date -d "$review" +%s 2>/dev/null)
            if [ -z "$review_sec" ]; then
              echo "| $f | $review (parse hatasi) | — | 🔴 |" >> report.md
              continue
            fi

            age_days=$(( (today_sec - review_sec) / 86400 ))

            if [ $age_days -gt 120 ]; then
              very_stale=$((very_stale + 1))
              echo "| $f | $review | $age_days gün | 🔴 cok bayat |" >> report.md
            elif [ $age_days -gt 60 ]; then
              stale=$((stale + 1))
              echo "| $f | $review | $age_days gün | ⚠️ bayat |" >> report.md
            fi
          done < <(find docs/memory -name "*.md" -not -name "_template*")

          echo "" >> report.md
          echo "**Toplam:** 🔴 cok bayat: $very_stale · ⚠️ bayat: $stale · 🔴 metadata eksik: $no_metadata" >> report.md

          echo "very_stale=$very_stale" >> $GITHUB_OUTPUT
          echo "stale=$stale" >> $GITHUB_OUTPUT
          echo "no_metadata=$no_metadata" >> $GITHUB_OUTPUT

      - name: Broken link denetimi
        if: steps.check.outputs.exists == 'true'
        id: links
        continue-on-error: true
        run: |
          echo "" >> report.md
          echo "## Broken Link Raporu" >> report.md
          echo "" >> report.md
          echo '```' >> report.md
          lychee --no-progress 'docs/memory/**/*.md' 2>&1 | tee -a report.md || true
          echo '```' >> report.md

      - name: Git log cross-check (kod degisti, doc eski)
        if: steps.check.outputs.exists == 'true'
        run: |
          echo "" >> report.md
          echo "## Stale-but-Active (son 30 günde kod degisti, doc eski)" >> report.md
          echo "" >> report.md
          echo "| Module doc | Kod path | Son 30gun commit |" >> report.md
          echo "|---|---|---|" >> report.md

          for module_doc in docs/memory/20-modules/*.md; do
            [ -f "$module_doc" ] || continue
            base=$(basename "$module_doc" .md)
            [ "$base" = "_template" ] && continue

            # Modulun referans verdigi kod path'lerini bul (## Kod bolumu)
            paths=$(awk '/^## Kod/,/^## /' "$module_doc" | grep -oE '`[^`]+/`' | tr -d '`' | head -5)

            for p in $paths; do
              [ -d "$p" ] || continue
              recent=$(git log --since="30 days ago" --oneline -- "$p" 2>/dev/null | wc -l)
              if [ "$recent" -gt 0 ]; then
                review=$(grep -m1 "^last_reviewed:" "$module_doc" | sed 's/last_reviewed: *//' | tr -d '"' | xargs)
                review_sec=$(date -d "$review" +%s 2>/dev/null)
                today_sec=$(date +%s)
                age=$(( (today_sec - review_sec) / 86400 ))
                if [ "$age" -gt 30 ]; then
                  echo "| $module_doc | $p | $recent commit |" >> report.md
                fi
              fi
            done
          done

      - name: Issue ac
        if: steps.check.outputs.exists == 'true' && (steps.staleness.outputs.very_stale > 0 || steps.staleness.outputs.no_metadata > 0)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('report.md', 'utf8');
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[memory] Aylik review — ${new Date().toISOString().split('T')[0]}`,
              body: body,
              labels: ['memory-review', 'automated']
            });

      - name: Upload report
        if: always() && steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: memory-review-${{ github.run_id }}
          path: report.md
          if-no-files-found: ignore
