name: Skill Evals

on:
  pull_request:
    paths:
      - 'adapted/**/SKILL.md'
      - 'skills/**/SKILL.md'
      - 'evals/skills/**.json'
      - 'evals/runner.ts'

  # Haftalik full-suite eval — description bozulmasini erken yakalar
  schedule:
    - cron: '0 6 * * 1'   # Pazartesi 06:00 UTC

  # Manuel tetikleme
  workflow_dispatch:
    inputs:
      mode:
        description: 'Eval modu'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - changed-only

jobs:
  eval:
    name: Trigger accuracy check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # HEAD~1 için gerekli (changed-only mod)

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: evals/package-lock.json

      - name: Install eval dependencies
        working-directory: evals
        run: npm ci

      - name: Determine eval mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "args=--changed-only" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "args=--all" >> $GITHUB_OUTPUT
          else
            if [ "${{ inputs.mode }}" = "all" ]; then
              echo "args=--all" >> $GITHUB_OUTPUT
            else
              echo "args=--changed-only" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run skill evals
        working-directory: evals
        run: npx tsx runner.ts ${{ steps.mode.outputs.args }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.run_id }}
          path: evals/results/
          if-no-files-found: ignore

      - name: Open issue on weekly failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[eval] Haftalik full-suite basarisiz — ${new Date().toISOString().split('T')[0]}`,
              body: `Haftalik eval suite eşik altında. Detay için workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n**Olası sebepler:**\n- Skill description bozulmuş (trigger doğruluğu düşmüş)\n- Yeni eklenen skill, mevcut skill ile çakışıyor (confusion)\n- Eval query'leri güncellenmeli\n\n**Önerilen aksiyon:**\n- Logs'ta hangi skill düştü kontrol et\n- O skill'in description'ını ve eval JSON'ını gözden geçir`,
              labels: ['eval-failure', 'automated']
            })
